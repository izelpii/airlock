# Shared proxy settings, included by every location that forwards upstream.
#
# Timeouts are deliberately NOT here. This file is included INTO a location, so
# a directive set here lands in that location's own context - and a location
# that then needs a different value (socket.io, ollama) would be setting the
# same directive twice in one context, which nginx rejects outright:
#
#   [emerg] "proxy_read_timeout" directive is duplicate
#
# Timeouts are set once at http level in airlock.conf.template instead, where
# per-location overrides inherit and replace cleanly.
#
# client_max_body_size stays: nginx defaults to 1 MB, which would reject every
# image upload to /api/upload, and no location needs a different value.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;

client_max_body_size 100M;
