# Podman Kubernetes pod manifest for the airlock gateway.
#
# Build the image first (from systems/gateway/):
#   podman build -f Dockerfile -t airlock-gateway .
#
# Run with:
#   podman play kube gateway-pod.yaml
#
# Tear down with:
#   podman play kube --down gateway-pod.yaml
#
# This is the only pod that publishes a port. Every other service keeps its
# hostPort so the gateway can reach it through host.containers.internal, but
# nothing in the application refers to those ports any more - only
# airlock.conf.template does.
#
# ── Before running this, generate the certificates ────────────────────────────
#   ./make-certs.sh
#
# airlock.conf.template has a `listen 443 ssl` block that loads
# /etc/nginx/certs/{fullchain,privkey}.pem. Without the certs volume below,
# nginx does not fall back to HTTP - it FAILS TO START. start-podman.sh checks
# for the files and validates the config before running; `podman play kube`
# cannot, so the failure arrives as a container that exits immediately.
#
# Keep this file in step with start-podman.sh. The two have drifted before:
# this manifest was written before TLS existed and silently lacked the port,
# the domain and the certificate mount for as long as nobody used it.

apiVersion: v1
kind: Pod
metadata:
  name: airlock-gateway
  labels:
    app: airlock-gateway
spec:
  # host.containers.internal is provided by podman, but declaring it explicitly
  # keeps this working across podman versions and matches what
  # backend-albums-pod.yaml already does.
  hostAliases:
    - ip: "host-gateway"
      hostnames:
        - "host.containers.internal"

  containers:
    - name: airlock-gateway
      image: localhost/airlock-gateway:latest

      ports:
        # Port 80 from a rootless pod works on macOS because the podman machine's
        # port forwarder does the publishing. If this is refused on your machine,
        # change BOTH numbers to 8080 and add :8080 to the names in
        # hosts-entries.txt - one port for the whole system instead of seven.
        - containerPort: 80
          hostPort: 80
          protocol: TCP

        # TLS. start-podman.sh publishes this as TLS_PORT (default 443).
        - containerPort: 443
          hostPort: 443
          protocol: TCP

      env:
        - name: UPSTREAM_HOST
          value: "host.containers.internal"

        # Substituted into airlock.conf.template at container start, as the
        # server_name of the TLS listener. Change it here AND in start-podman.sh
        # when moving to a public domain.
        - name: SERVER_DOMAIN
          value: "airlock.lan"

      volumeMounts:
        # Read-only: nginx only ever reads these, and a compromised gateway
        # should not be able to rewrite the certificate it serves.
        - name: certs
          mountPath: /etc/nginx/certs
          readOnly: true

      securityContext:
        runAsNonRoot: false          # nginx needs root to bind :80, then drops
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: false

  volumes:
    # Generated by ./make-certs.sh, relative to the directory you run
    # `podman play kube` from (systems/gateway/).
    #
    # type is Directory, not DirectoryOrCreate: an empty directory here means
    # nginx starts, fails to load the certificate and exits. Fail on the missing
    # directory instead, where the cause is legible.
    - name: certs
      hostPath:
        path: ./certs
        type: Directory

  restartPolicy: Always
