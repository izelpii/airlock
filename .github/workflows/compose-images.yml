# Publish the compose install's images on each release. All the logic is in
# compose/ci/ (compose/README.md, "Building the images"); this file only gives
# it a machine, a registry login and the release number.
#
# Three-part tags only (v6.6.0): four-part releases change documentation, and
# nothing in an image (CHANGELOG.md, "What moves which number").

name: compose images

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to (re)publish, e.g. 6.6.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the gallery's revision is read from git history
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          compose/ci/build.sh --push \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" \
            --version "${VERSION#v}"
      - name: Smoke test the pushed images
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          compose/ci/smoke-test.sh --images "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" --tag "${VERSION#v}"
          compose/ci/any-uid-test.sh --images "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" --tag "${VERSION#v}"
