# Publish the compose install's images on each release. All the logic is in
# compose/ci/ (compose/README.md, "Building the images"); this file only gives
# it machines, a registry login and the release number.
#
# Each architecture builds natively, on its own runner, in parallel: under
# QEMU emulation the arm64 builds alone ran past GitHub's six-hour limit. The
# merge job then joins the two into the release tags.
#
# GitHub sends no push event for more than three tags pushed at once, so push
# a release's tag on its own - or run this by hand (Actions > Run workflow).
#
# Three-part tags only (v6.6.0): four-part releases change documentation, and
# nothing in an image (CHANGELOG.md, "What moves which number").

name: compose images

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to (re)publish, e.g. 6.6.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      # The NVIDIA faces image alone is several gigabytes; the runner's
      # preinstalled SDKs are not needed here.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the gallery's revision is read from git history
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }}
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          compose/ci/build.sh --push --arch ${{ matrix.arch }} \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" \
            --version "${VERSION#v}"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the same commit, so the same sha-<commit> tag
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures into the release tags
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          compose/ci/build.sh --merge \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" \
            --version "${VERSION#v}"
      - name: Smoke test the published images
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          compose/ci/smoke-test.sh --images "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" --tag "${VERSION#v}"
          compose/ci/any-uid-test.sh --images "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" --tag "${VERSION#v}"
